<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#141a29"/>
      <stop offset="100%" stop-color="#070a10"/>
    </radialGradient>
    
    <!-- Gold Gradients -->
    <linearGradient id="goldLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="goldRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="40%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <linearGradient id="goldWings" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- Cyan Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Obsidian Base with smooth squircle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" stroke="#1e293b" stroke-width="2"/>

  <!-- Cyan Neon Backlight Halo -->
  <g filter="url(#neonGlow)">
    <path d="M120 160 L256 360 L392 160" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    <path d="M78 160 L150 290" stroke="#0ea5e9" stroke-width="8" stroke-linecap="round" opacity="0.75"/>
    <path d="M434 160 L362 290" stroke="#0ea5e9" stroke-width="8" stroke-linecap="round" opacity="0.75"/>
  </g>

  <!-- Wing Elements Left -->
  <path d="M80 160 L150 210 L130 250 L95 210 Z" fill="url(#goldWings)"/>
  <path d="M98 220 L156 262 L144 290 L115 260 Z" fill="url(#goldWings)"/>

  <!-- Wing Elements Right -->
  <path d="M432 160 L362 210 L382 250 L417 210 Z" fill="url(#goldWings)"/>
  <path d="M414 220 L356 262 L368 290 L397 260 Z" fill="url(#goldWings)"/>

  <!-- Central 3D Faceted V -->
  <!-- Left arm -->
  <path d="M130 160 L200 160 L256 325 L215 325 Z" fill="url(#goldLeft)"/>
  <path d="M215 325 L256 325 L256 365 Z" fill="#713f12"/>
  
  <!-- Right arm -->
  <path d="M382 160 L312 160 L256 325 L297 325 Z" fill="url(#goldRight)"/>
  <path d="M297 325 L256 325 L256 365 Z" fill="#ca8a04"/>

  <!-- Center Facet & Bevel Highlight -->
  <path d="M200 160 L256 325 L256 160 Z" fill="#fef08a" opacity="0.25"/>
  <path d="M312 160 L256 325 L256 160 Z" fill="#ffffff" opacity="0.15"/>

  <!-- Bottom Statement Ledger Sync Blocks -->
  <rect x="175" y="350" width="30" height="12" rx="4" transform="rotate(-30 175 350)" fill="url(#goldWings)"/>
  <rect x="205" y="372" width="28" height="12" rx="4" transform="rotate(-30 205 372)" fill="url(#goldWings)"/>
  <rect x="307" y="350" width="30" height="12" rx="4" transform="rotate(30 307 350)" fill="url(#goldWings)"/>
  <rect x="279" y="372" width="28" height="12" rx="4" transform="rotate(30 279 372)" fill="url(#goldWings)"/>
  <rect x="238" y="392" width="36" height="12" rx="4" fill="url(#goldWings)"/>
</svg>
