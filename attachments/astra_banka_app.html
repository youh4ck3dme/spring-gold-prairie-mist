<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />

  <title>Tatra banka – Mobilná aplikácia</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", sans-serif;
      background-color: #050507;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
    }

    /* Jemný vnútorný lesk na primárnom tlačidle úvodnej obrazovky */
    .btn-primary-glow {
      background: linear-gradient(180deg, #1b93ff 0%, #057aff 100%);
      box-shadow: 0 4px 20px rgba(10, 132, 255, 0.25);
    }

    .btn-secondary-border {
      border: 1.2px solid #163863;
      background: rgba(0, 0, 0, 0.45);
    }

    .help-btn-surface {
      background: radial-gradient(circle at 50% 30%, #32343a 0%, #222327 100%);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.08);
    }

    /* Skrytie scrollbaru pre čistý mobilný vzhľad */
    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-none {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Plynulé prechody medzi obrazovkami (SPA) */
    .screen-transition {
      transition: opacity 340ms cubic-bezier(0.22, 1, 0.36, 1),
                  transform 340ms cubic-bezier(0.22, 1, 0.36, 1);
      will-change: opacity, transform;
    }

    .screen-hidden-left {
      opacity: 0;
      transform: scale(0.95) translateY(-8px);
      pointer-events: none;
    }

    .screen-hidden-right {
      opacity: 0;
      transform: scale(1.03) translateY(12px);
      pointer-events: none;
    }

    .screen-active {
      opacity: 1;
      transform: scale(1) translateY(0);
      pointer-events: auto;
    }

    /* Jemná animácia zámku */
    @keyframes floatLock {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }
    .lock-float {
      animation: floatLock 4s ease-in-out infinite;
    }

    /* Zatrasenie pri prázdnom hesle */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .animate-shake {
      animation: shake 0.35s ease-in-out;
    }

    input::-ms-reveal,
    input::-ms-clear {
      display: none;
    }
  </style>
</head>

          <button id="btn-close-sheet" type="button" class="w-7 h-7 rounded-full bg-zinc-800 text-zinc-300 flex items-center justify-center text-sm hover:text-white cursor-pointer">✕</button>
        </div>
        <div id="sheet-body" class="mt-4 overflow-y-auto scrollbar-none text-sm text-zinc-200 space-y-3"></div>
      </div>
    </div>

    <!-- ======================================================= -->
    <!-- TOAST NOTIFIKÁCIA                                       -->
    <!-- ======================================================= -->
    <div id="toast-notification" class="fixed sm:absolute top-4 left-1/2 -translate-x-1/2 z-50 bg-[#252830] border border-[#0088FF]/60 text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-xl opacity-0 pointer-events-none transition-all duration-300 flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-[#0088FF]"></span>
      <span id="toast-text">Hotovo</span>
    </div>

  </main>

  <!-- ========================================================= -->
  <!-- JAVASCRIPT LOGIKA PRECHODOV A VŠETKÝCH FUNKČNÝCH TLAČIDIEL -->
  <!-- ========================================================= -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // ---------------------------------------------------------
      // 1. DÁTA ÚČTOV A TRANSAKCIÍ
      // ---------------------------------------------------------
      const accountsData = {
        eur: {
          id: 'eur',
          type: 'current',
          name: 'EUR ucet',
          balance: 3840.07,
          ibanPrefix: 'SK05',
          ibanBank: '1100',
          ibanZeros: '000000',
          ibanNumber: '2900000005',
          ibanFull: 'SK05 1100 0000 0029 0000 0005',
          transactions: [
            { id: 1, title: "Zamestnávateľ", date: "02.04.2019", amount: "200,00 EUR", positive: true, vs: "201904", iban: "SK88 1100 0000 0026 1122 3344", note: "Mzda za marec" },
            { id: 2, title: "Smart fond", date: "25.03.2019", amount: "- 15,00 EUR", positive: false, vs: "550012", iban: "SK42 1100 0000 0019 8877 6655", note: "Pravidelné investovanie" },
            { id: 3, title: "Supermarket", date: "20.03.2019", amount: "- 10,95 EUR", positive: false, vs: "908122", iban: "SK19 1100 0000 0044 5566 7788", note: "Platba kartou POS" },
            { id: 4, title: "Dodávateľ energie", date: "15.03.2019", amount: "- 12,81 EUR", positive: false, vs: "774100", iban: "SK61 0900 0000 0050 1122 9988", note: "Inkaso elektrina" },
            { id: 5, title: "Operátor", date: "16.03.2019", amount: "- 7,50 EUR", positive: false, vs: "330192", iban: "SK33 1100 0000 0088 4422 1100", note: "Faktúra za mobilné služby" },
            { id: 6, title: "Bytový dom", date: "15.03.2019", amount: "- 10,95 EUR", positive: false, vs: "100419", iban: "SK74 1100 0000 0031 9900 1122", note: "Zálohový predpis" },
            { id: 7, title: "Tatra banka", date: "28.02.2019", amount: "- 1,00 EUR", positive: false, vs: "000219", iban: "SK05 1100 0000 0029 0000 0005", note: "Poplatok za vedenie účtu" },
            { id: 8, title: "Kreditná karta účet", date: "28.02.2019", amount: "- 7,00 EUR", positive: false, vs: "445566", iban: "SK91 1100 0000 0077 0000 1111", note: "Splátka kreditnej karty" },
            { id: 9, title: "Sporiaci účet", date: "21.02.2019", amount: "23,40 EUR", positive: true, vs: "002102", iban: "SK13 1100 0000 0050 0000 0003", note: "Prevod zo sporiaceho účtu" },
            { id: 10, title: "Výber z bankomatu", date: "20.02.2019", amount: "- 50,00 EUR", positive: false, vs: "002002", iban: "SK05 1100 0000 0029 0000 0005", note: "Výber hotovosti ATM Tatra banka" }
          ]
        },
        saving: {
          id: 'saving',
          type: 'saving',
          name: 'Sporiaci ucet',
          balance: 2304.00,
          ibanPrefix: 'SK13',
          ibanBank: '1100',
          ibanZeros: '000000',
          ibanNumber: '5000000003',
          ibanFull: 'SK13 1100 0000 0050 0000 0003',
          transactions: [
            { id: 101, title: "Pravidelné sporenie", date: "15.04.2019", amount: "100,00 EUR", positive: true, vs: "201904", iban: "SK05 1100 0000 0029 0000 0005", note: "Trvalý príkaz na sporenie" },
            { id: 102, title: "Úrok zo sporenia", date: "31.03.2019", amount: "4,20 EUR", positive: true, vs: "000319", iban: "SK13 1100 0000 0050 0000 0003", note: "Kreditný úrok" },
            { id: 103, title: "Prevod na EUR ucet", date: "21.02.2019", amount: "- 23,40 EUR", positive: false, vs: "002102", iban: "SK05 1100 0000 0029 0000 0005", note: "Interný prevod" }
          ]
        }
      };

      let activeAccountId = 'eur';
      let accountFilterMode = 'all'; // 'all' | 'current' | 'saving'
      let screenHistory = ['welcome'];
      let historyIndex = 0;

      // Pomocná funkcia pre formátovanie sumy
      function formatEUR(num) {
        return num.toLocaleString('sk-SK', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' EUR';
      }

      // ---------------------------------------------------------
      // 2. TOAST A BOTTOM SHEET SYSTÉM
      // ---------------------------------------------------------
      const toastEl = document.getElementById('toast-notification');
      const toastText = document.getElementById('toast-text');
      let toastTimeout = null;

      function showToast(msg) {
        toastText.textContent = msg;
        toastEl.classList.remove('opacity-0');
        toastEl.classList.add('opacity-100');
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
          toastEl.classList.remove('opacity-100');
          toastEl.classList.add('opacity-0');
        }, 2400);
      }

      const sheetOverlay = document.getElementById('bottom-sheet-overlay');
      const sheetPanel = document.getElementById('bottom-sheet-panel');
      const sheetTitle = document.getElementById('sheet-title');
      const sheetBody = document.getElementById('sheet-body');
      const btnCloseSheet = document.getElementById('btn-close-sheet');

      function openSheet(title, htmlContent) {
        sheetTitle.textContent = title;
        sheetBody.innerHTML = htmlContent;
        sheetOverlay.classList.remove('hidden');
        requestAnimationFrame(() => {
          sheetOverlay.classList.remove('opacity-0');
          sheetPanel.classList.remove('translate-y-full');
        });
      }

      function closeSheet() {
        sheetOverlay.classList.add('opacity-0');
        sheetPanel.classList.add('translate-y-full');
        setTimeout(() => {
          sheetOverlay.classList.add('hidden');
        }, 240);
      }

      btnCloseSheet.addEventListener('click', closeSheet);
      sheetOverlay.addEventListener('click', (e) => {
        if (e.target === sheetOverlay) closeSheet();
      });

      function copyTextToClipboard(text, label = 'Skopírované do schránky') {
        const temp = document.createElement('textarea');
        temp.value = text;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand('copy');
        document.body.removeChild(temp);
        showToast(label);
      }

      // ---------------------------------------------------------
      // 3. VYKRESLENIE KARIET ÚČTOV A POHYBOV (1:1 DIZAJN)
      // ---------------------------------------------------------
      const accountsCardsContainer = document.getElementById('accounts-cards-container');
      const transactionsContainer = document.getElementById('transactions-container');
      const movementsCounter = document.getElementById('movements-counter');
      const searchMovementsInput = document.getElementById('search-movements-input');
      const activeAccountSubtitle = document.getElementById('active-account-subtitle');

      function renderAccountsCards() {
        const list = Object.values(accountsData).filter(acc => {
          if (accountFilterMode === 'current') return acc.type === 'current';
          if (accountFilterMode === 'saving') return acc.type === 'saving';
          return true;
        });

        accountsCardsContainer.innerHTML = list.map(acc => {
          const isActive = acc.id === activeAccountId;
          const savingIcon = acc.type === 'saving' ? `
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9ca0a8" stroke-width="1.4">
              <circle cx="13" cy="12" r="7" />
              <path d="M9 6.5A7 7 0 0 0 5 12a7 7 0 0 0 4 5.5" />
              <text x="11" y="15" fill="#9ca0a8" stroke="none" font-size="9" font-family="sans-serif">€</text>
            </svg>
          ` : '';

          if (isActive) {
            return `
              <div data-select-account="${acc.id}" class="border border-[#0088FF] bg-[#1F2126] px-4 pt-[15px] pb-[14px] cursor-pointer transition-colors">
                <div class="flex justify-between items-baseline">
                  <div class="flex items-center gap-2">
                    ${savingIcon}
                    <span class="text-[14px] text-white font-normal">${acc.name}</span>
                  </div>
                  <span class="text-[15px] text-white font-medium">${formatEUR(acc.balance)}</span>
                </div>

                <div class="flex justify-between items-baseline mt-[6px] pb-[15px] border-b border-[#34373f]">
                  <span class="text-[12.5px] tracking-[0.01em]">
                    <span class="text-[#9ca0a8]">${acc.ibanPrefix}</span><span class="text-white font-medium">${acc.ibanBank}</span><span class="text-[#9ca0a8]">${acc.ibanZeros}</span><span class="text-white font-medium">${acc.ibanNumber}</span>
                  </span>
                  <span class="text-[12.5px] text-[#9ca0a8]">Disponibilný zostatok</span>
                </div>

                <!-- 3 AKČNÉ TLAČIDLÁ V AKTÍVNEJ KARTE: Detail | Pohyby | Možnosti -->
                <div class="grid grid-cols-3 pt-[14px] text-center">
                  <button data-account-action="detail" type="button" class="flex flex-col items-center gap-[7px] active:opacity-75 focus:outline-none cursor-pointer">
                    <span class="w-[20px] h-[20px] rounded-full border-[1.4px] border-[#0088FF] text-[#0088FF] flex items-center justify-center text-[11px] font-serif">i</span>
                    <span class="text-[12.5px] text-white">Detail</span>
                  </button>

                  <button data-account-action="movements" type="button" class="flex flex-col items-center gap-[7px] active:opacity-75 focus:outline-none cursor-pointer">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0088FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                      <polyline points="16 3 21 8 16 13" />
                      <line x1="3" y1="8" x2="21" y2="8" />
                      <polyline points="8 21 3 16 8 11" />
                      <line x1="21" y1="16" x2="3" y2="16" />
                    </svg>
                    <span class="text-[12.5px] text-white">Pohyby</span>
                  </button>

                  <button data-account-action="options" type="button" class="flex flex-col items-center gap-[7px] active:opacity-75 focus:outline-none cursor-pointer">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="#0088FF">
                      <circle cx="12" cy="5" r="1.8" />
                      <circle cx="12" cy="12" r="1.8" />
                      <circle cx="12" cy="19" r="1.8" />
                    </svg>
                    <span class="text-[12.5px] text-white">Možnosti</span>
                  </button>
                </div>
              </div>
            `;
          } else {
            return `
              <div data-select-account="${acc.id}" class="bg-[#1C1D21] hover:bg-[#202227] px-4 py-[15px] border-b border-[#26282e] cursor-pointer transition-colors">
                <div class="flex justify-between items-center">
                  <div class="flex items-center gap-2">
                    ${savingIcon}
                    <span class="text-[14px] text-white font-normal">${acc.name}</span>
                  </div>
                  <span class="text-[15px] text-white font-medium">${formatEUR(acc.balance)}</span>
                </div>

                <div class="flex justify-between items-baseline mt-[6px]">
                  <span class="text-[12.5px] tracking-[0.01em]">
                    <span class="text-[#9ca0a8]">${acc.ibanPrefix}</span><span class="text-white font-medium">${acc.ibanBank}</span><span class="text-[#9ca0a8]">${acc.ibanZeros}</span><span class="text-white font-medium">${acc.ibanNumber}</span>
                  </span>
                  <span class="text-[12.5px] text-[#9ca0a8]">Disponibilný zostatok</span>
                </div>
              </div>
            `;
          }
        }).join('');

        activeAccountSubtitle.textContent = `na účte ${accountsData[activeAccountId].name}`;
      }

      function renderTransactions(query = '') {
        const cleanQuery = query.trim().toLowerCase();
        const currentList = accountsData[activeAccountId].transactions;
        const filtered = currentList.filter(item =>
          item.title.toLowerCase().includes(cleanQuery) ||
          item.date.includes(cleanQuery) ||
          item.amount.toLowerCase().includes(cleanQuery)
        );

        movementsCounter.textContent = `Pohyby: ${filtered.length}`;
        transactionsContainer.innerHTML = filtered.map(item => `
          <div data-tx-id="${item.id}" class="px-4 py-[13px] flex justify-between items-center hover:bg-zinc-800/45 active:bg-zinc-800/70 transition-colors cursor-pointer">
            <div>
              <div class="text-[14px] text-white font-normal">${item.title}</div>
              <div class="text-[12.5px] text-[#9ca0a8] mt-[7px]">${item.date}</div>
            </div>
            <div class="text-[14px] font-medium ${item.positive ? 'text-[#269D69]' : 'text-[#B93848]'}">
              ${item.amount}
            </div>
          </div>
        `).join('');
      }

      renderAccountsCards();
      renderTransactions();

      // Kliknutie na karty účtov alebo ich 3 akčné tlačidlá
      accountsCardsContainer.addEventListener('click', (e) => {
        const actionBtn = e.target.closest('[data-account-action]');
        if (actionBtn) {
          e.stopPropagation();
          const action = actionBtn.getAttribute('data-account-action');
          const acc = accountsData[activeAccountId];

          if (action === 'detail') {
            openSheet(`Detail účtu – ${acc.name}`, `
              <div class="bg-[#16171B] p-3.5 rounded-xl border border-zinc-800 space-y-2.5">
                <div class="flex justify-between text-xs"><span class="text-zinc-400">Názov účtu:</span><span class="text-white font-medium">${acc.name}</span></div>
                <div class="flex justify-between text-xs"><span class="text-zinc-400">Majiteľ účtu:</span><span class="text-white font-medium">Martin Kováč</span></div>
                <div class="flex justify-between text-xs"><span class="text-zinc-400">IBAN:</span><span class="text-white font-mono">${acc.ibanFull}</span></div>
                <div class="flex justify-between text-xs"><span class="text-zinc-400">BIC / SWIFT:</span><span class="text-white font-mono">TATRSKBX</span></div>
                <div class="flex justify-between text-xs pt-2 border-t border-zinc-800"><span class="text-zinc-400">Disponibilný zostatok:</span><span class="text-[#0088FF] font-semibold">${formatEUR(acc.balance)}</span></div>
              </div>
              <button id="btn-copy-iban" type="button" class="w-full py-3 rounded-xl bg-[#0088FF] text-white font-semibold text-sm active:scale-98 transition cursor-pointer">
                Kopírovať IBAN do schránky
              </button>
            `);
            document.getElementById('btn-copy-iban')?.addEventListener('click', () => {
              copyTextToClipboard(acc.ibanFull, 'IBAN bol skopírovaný');
              closeSheet();
            });
          } else if (action === 'movements') {
            document.getElementById('movements-section').scrollIntoView({ behavior: 'smooth' });
            setTimeout(() => searchMovementsInput.focus(), 400);
          } else if (action === 'options') {
            openAccountOptionsModal(acc);
          }
          return;
        }

        const cardEl = e.target.closest('[data-select-account]');
        if (cardEl) {
          const selectedId = cardEl.getAttribute('data-select-account');
          if (selectedId && selectedId !== activeAccountId) {
            activeAccountId = selectedId;
            renderAccountsCards();
            renderTransactions(searchMovementsInput.value);
            showToast(`Prepnité na ${accountsData[activeAccountId].name}`);
          }
        }
      });

      function openAccountOptionsModal(acc) {
        openSheet(`Možnosti – ${acc.name}`, `
          <div class="space-y-2">
            <button data-opt="pay" class="w-full p-3 rounded-xl bg-zinc-800/70 hover:bg-zinc-800 flex items-center justify-between text-left cursor-pointer">
              <span>💶 Nová platba z účtu</span><span class="text-[#0088FF]">→</span>
            </button>
            <button data-opt="copy" class="w-full p-3 rounded-xl bg-zinc-800/70 hover:bg-zinc-800 flex items-center justify-between text-left cursor-pointer">
              <span>📋 Kopírovať IBAN</span><span class="text-xs text-zinc-400">${acc.ibanPrefix}...${acc.ibanNumber.slice(-4)}</span>
            </button>
            <button data-opt="standing" class="w-full p-3 rounded-xl bg-zinc-800/70 hover:bg-zinc-800 flex items-center justify-between text-left cursor-pointer">
              <span>🔄 Trvalé príkazy a inkasá</span><span class="text-xs text-zinc-400">3 aktívne</span>
            </button>
            <button data-opt="pdf" class="w-full p-3 rounded-xl bg-zinc-800/70 hover:bg-zinc-800 flex items-center justify-between text-left cursor-pointer">
              <span>📄 Stiahnuť elektronický výpis (PDF)</span><span class="text-[#0088FF]">↓</span>
            </button>
          </div>
        `);
        sheetBody.querySelectorAll('[data-opt]').forEach(btn => {
          btn.addEventListener('click', () => {
            const opt = btn.getAttribute('data-opt');
            if (opt === 'pay') {
              openNewPaymentModal();
            } else if (opt === 'copy') {
              copyTextToClipboard(acc.ibanFull, 'IBAN skopírovaný');
              closeSheet();
            } else if (opt === 'standing') {
              showToast('Zobrazujem trvalé príkazy');
              closeSheet();
            } else if (opt === 'pdf') {
              showToast('Výpis PDF bol pripravený na stiahnutie');
              closeSheet();
            }
          });
        });
      }

      // Kliknutie na konkrétnu transakciu -> Detail transakcie + Zopakovať platbu
      transactionsContainer.addEventListener('click', (e) => {
        const row = e.target.closest('[data-tx-id]');
        if (!row) return;
        const txId = Number(row.getAttribute('data-tx-id'));
        const tx = accountsData[activeAccountId].transactions.find(t => t.id === txId);
        if (!tx) return;

        openSheet('Detail pohybu', `
          <div class="bg-[#16171B] p-4 rounded-xl border border-zinc-800 space-y-2.5">
            <div class="flex justify-between items-center pb-2 border-b border-zinc-800">
              <span class="text-white font-semibold text-base">${tx.title}</span>
              <span class="font-bold text-base ${tx.positive ? 'text-[#269D69]' : 'text-[#B93848]'}">${tx.amount}</span>
            </div>
            <div class="flex justify-between text-xs"><span class="text-zinc-400">Dátum zaúčtovania:</span><span class="text-white">${tx.date}</span></div>
            <div class="flex justify-between text-xs"><span class="text-zinc-400">Protiúčet (IBAN):</span><span class="text-white font-mono">${tx.iban}</span></div>
            <div class="flex justify-between text-xs"><span class="text-zinc-400">Variabilný symbol:</span><span class="text-white">${tx.vs}</span></div>
            <div class="flex justify-between text-xs"><span class="text-zinc-400">Informácia pre príjemcu:</span><span class="text-white">${tx.note}</span></div>
          </div>
          <div class="grid grid-cols-2 gap-2.5 pt-1">
            <button id="btn-tx-copy" type="button" class="py-2.5 rounded-xl bg-zinc-800 text-white text-xs font-semibold cursor-pointer">Kopírovať IBAN</button>
            <button id="btn-tx-repeat" type="button" class="py-2.5 rounded-xl bg-[#0088FF] text-white text-xs font-semibold cursor-pointer">Zopakovať platbu</button>
          </div>
        `);

        document.getElementById('btn-tx-copy')?.addEventListener('click', () => {
          copyTextToClipboard(tx.iban, 'IBAN protiúčtu skopírovaný');
          closeSheet();
        });
        document.getElementById('btn-tx-repeat')?.addEventListener('click', () => {
          openNewPaymentModal(tx.title, tx.iban, Math.abs(parseFloat(tx.amount.replace(/[^0-9,-]/g, '').replace(',', '.')) || 10));
        });
      });

      searchMovementsInput.addEventListener('input', (e) => {
        renderTransactions(e.target.value);
      });

      // ---------------------------------------------------------
      // 4. FORMULÁR NOVEJ PLATBY (REÁLNE PRIDÁ POHYB A UPRAVÍ ZOSTATOK)
      // ---------------------------------------------------------
      function openNewPaymentModal(prefillRecipient = '', prefillIban = 'SK88 1100 0000 0026 1122 3344', prefillAmount = '') {
        const acc = accountsData[activeAccountId];
        openSheet('Nová SEPA platba', `
          <form id="form-new-payment" class="space-y-3">
            <div class="text-xs text-zinc-400">Z účtu: <span class="text-white font-medium">${acc.name} (${formatEUR(acc.balance)})</span></div>
            <div>
              <label class="text-xs text-zinc-400 block mb-1">Názov príjemcu</label>
              <input id="pay-recipient" type="text" required value="${prefillRecipient}" placeholder="Napr. Potraviny, Prenájom..." class="w-full bg-[#141519] border border-zinc-700 rounded-lg px-3 py-2 text-white text-sm focus:border-[#0088FF] focus:outline-none" />
            </div>
            <div>
              <label class="text-xs text-zinc-400 block mb-1">IBAN príjemcu</label>
              <input id="pay-iban" type="text" required value="${prefillIban}" class="w-full bg-[#141519] border border-zinc-700 rounded-lg px-3 py-2 text-white text-xs font-mono focus:border-[#0088FF] focus:outline-none" />
            </div>
            <div class="grid grid-cols-2 gap-2.5">
              <div>
                <label class="text-xs text-zinc-400 block mb-1">Suma (EUR)</label>
                <input id="pay-amount" type="number" step="0.01" min="0.01" required value="${prefillAmount}" placeholder="25.00" class="w-full bg-[#141519] border border-zinc-700 rounded-lg px-3 py-2 text-white text-sm focus:border-[#0088FF] focus:outline-none" />
              </div>
              <div>
                <label class="text-xs text-zinc-400 block mb-1">Variabilný symbol</label>
                <input id="pay-vs" type="text" value="20261029" class="w-full bg-[#141519] border border-zinc-700 rounded-lg px-3 py-2 text-white text-sm focus:border-[#0088FF] focus:outline-none" />
              </div>
            </div>
            <button type="submit" class="w-full py-3 rounded-xl bg-[#0088FF] hover:bg-[#0077e6] text-white font-semibold text-sm shadow cursor-pointer">
              Odoslať platbu
            </button>
          </form>
        `);

        document.getElementById('form-new-payment')?.addEventListener('submit', (ev) => {
          ev.preventDefault();
          const recipient = document.getElementById('pay-recipient').value.trim() || 'SEPA Platba';
          const iban = document.getElementById('pay-iban').value.trim();
          const amountVal = parseFloat(document.getElementById('pay-amount').value);
          const vs = document.getElementById('pay-vs').value.trim() || '0000';

          if (!amountVal || amountVal <= 0) return;

          accountsData[activeAccountId].balance = Math.max(0, accountsData[activeAccountId].balance - amountVal);
          const formattedAmt = '- ' + amountVal.toLocaleString('sk-SK', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' EUR';

          accountsData[activeAccountId].transactions.unshift({
            id: Date.now(),
            title: recipient,
            date: '29.10.2026',
            amount: formattedAmt,
            positive: false,
            vs,
            iban,
            note: 'Odoslaná SEPA platba'
          });

          renderAccountsCards();
          renderTransactions(searchMovementsInput.value);
          closeSheet();
          showToast(`Platba ${formattedAmt} bola odoslaná`);
        });
      }

      // ---------------------------------------------------------
      // 5. NAVIGÁCIA MEDZI 3 OBRAZOVKAMI A HISTÓRIA PREHLIADAČA
      // ---------------------------------------------------------
      const welcomeScreen = document.getElementById('welcome-screen');
      const loginScreen = document.getElementById('login-screen');
      const dashboardScreen = document.getElementById('dashboard-screen');

      const screenMap = {
        welcome: welcomeScreen,
        login: loginScreen,
        dashboard: dashboardScreen
      };

      function navigateTo(screenKey, recordHistory = true) {
        const targetScreen = screenMap[screenKey];
        if (!targetScreen) return;

        [welcomeScreen, loginScreen, dashboardScreen].forEach(screen => {
          screen.classList.remove('screen-active', 'screen-hidden-left', 'screen-hidden-right');
          if (screen === targetScreen) {
            screen.classList.add('screen-active');
          } else if (screen === welcomeScreen) {
            screen.classList.add('screen-hidden-left');
          } else {
            screen.classList.add('screen-hidden-right');
          }
        });

        if (recordHistory && screenHistory[historyIndex] !== screenKey) {
          screenHistory = screenHistory.slice(0, historyIndex + 1);
          screenHistory.push(screenKey);
          historyIndex = screenHistory.length - 1;
        }
      }

            <button data-period="29.07.2026 - 29.10.2026" class="w-full p-3 rounded-xl bg-zinc-800/70 text-left cursor-pointer">Posledné 3 mesiace (29.07.2026 - 29.10.2026)</button>
            <button data-period="01.01.2019 - 29.10.2026" class="w-full p-3 rounded-xl bg-zinc-800/70 text-left cursor-pointer">Celá história účtu (01.01.2019 - 29.10.2026)</button>
          </div>
        `);
        sheetBody.querySelectorAll('[data-period]').forEach(b => {
          b.addEventListener('click', () => {
            document.getElementById('date-range-label').textContent = b.getAttribute('data-period');
            closeSheet();
            showToast('Obdobie pohybov bolo upravené');
          });
        });
      });

      // Plávajúce tlačidlá vpravo dole (FAB)
      document.getElementById('btn-fab-more').addEventListener('click', () => {
        const acc = accountsData[activeAccountId];
        openSheet('Rýchle akcie', `
          <div class="space-y-2">
            <button data-fab="pay" class="w-full p-3 rounded-xl bg-zinc-800/80 text-left cursor-pointer">💶 Nová platba</button>
            <button data-fab="qr" class="w-full p-3 rounded-xl bg-zinc-800/80 text-left cursor-pointer">📱 Zobraziť QR kód pre prijatie platby (Payme)</button>
            <button data-fab="iban" class="w-full p-3 rounded-xl bg-zinc-800/80 text-left cursor-pointer">📋 Kopírovať IBAN (${acc.name})</button>
          </div>
        `);
        sheetBody.querySelectorAll('[data-fab]').forEach(b => {
          b.addEventListener('click', () => {
            const act = b.getAttribute('data-fab');
            if (act === 'pay') openNewPaymentModal();
            else if (act === 'iban') {
              copyTextToClipboard(acc.ibanFull, 'IBAN skopírovaný');
              closeSheet();
            } else {
              closeSheet();
              showToast('Payme QR odkaz bol vygenerovaný');
            }
          });
        });
      });

      document.getElementById('btn-fab-call').addEventListener('click', () => {
        openSheet('DIALOG Live – Hlasová biometria', `
          <div class="py-4 text-center space-y-3">
            <div class="w-14 h-14 rounded-full bg-[#0088FF]/20 border border-[#0088FF] mx-auto flex items-center justify-center text-[#0088FF] text-xl">📞</div>
            <div class="text-white font-semibold text-base">Spojenie s klientskym centrom</div>
            <p class="text-xs text-zinc-400">Vďaka prihláseniu v aplikácii budete na linke *1100 okamžite overený bez zadávania karty a čítačky.</p>
            <button id="btn-start-call" type="button" class="w-full py-3 rounded-xl bg-[#269D69] text-white font-semibold text-sm cursor-pointer">
              Začať hovor (*1100)
            </button>
          </div>
        `);
        document.getElementById('btn-start-call')?.addEventListener('click', () => {
          closeSheet();
          showToast('Prebieha spájanie s DIALOG Live...');
        });
      });

      // Spodná lišta prehliadača (moja.tatrabanka.sk)
      document.getElementById('btn-browser-back').addEventListener('click', () => {
        if (historyIndex > 0) {
          historyIndex--;
          navigateTo(screenHistory[historyIndex], false);
        } else {
          navigateTo('login');
        }
      });

      document.getElementById('btn-browser-forward').addEventListener('click', () => {
        if (historyIndex < screenHistory.length - 1) {
          historyIndex++;
          navigateTo(screenHistory[historyIndex], false);
        } else {
          showToast('Ste na najnovšej obrazovke');
        }
      });

      document.getElementById('btn-browser-newtab').addEventListener('click', () => {
        navigateTo('welcome');
        showToast('Návrat na úvodnú obrazovku');
      });

      document.getElementById('btn-browser-share').addEventListener('click', () => {
        copyTextToClipboard('https://moja.tatrabanka.sk', 'Odkaz moja.tatrabanka.sk skopírovaný');
      });

      document.getElementById('btn-browser-lens').addEventListener('click', () => {
        openNewPaymentModal('Platba cez QR skener', 'SK88 1100 0000 0026 1122 3344', 19.90);
      });

      document.getElementById('btn-browser-tabs').addEventListener('click', () => {
        showToast('79 otvorených kariet v prehliadači');
      });

      document.getElementById('btn-browser-menu').addEventListener('click', () => {
        openSheet('Menu prehliadača', `
          <div class="space-y-2">
            <button data-bmenu="reload" class="w-full p-3 rounded-xl bg-zinc-800/70 text-left cursor-pointer">🔄 Obnoviť stránku moja.tatrabanka.sk</button>
            <button data-bmenu="copy" class="w-full p-3 rounded-xl bg-zinc-800/70 text-left cursor-pointer">🔗 Kopírovať URL adresu</button>
            <button data-bmenu="logout" class="w-full p-3 rounded-xl bg-red-500/15 text-red-400 text-left cursor-pointer">🚪 Odhlásiť sa z Internet bankingu</button>
          </div>
        `);
        sheetBody.querySelectorAll('[data-bmenu]').forEach(b => {
          b.addEventListener('click', () => {
            const m = b.getAttribute('data-bmenu');
            closeSheet();
            if (m === 'copy') copyTextToClipboard('https://moja.tatrabanka.sk', 'Adresa skopírovaná');
            else if (m === 'logout') navigateTo('welcome');
            else showToast('Stránka bola obnovená');
          });
        });
      });
    });
  </script>
</body>
</html>
